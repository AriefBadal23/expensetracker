name: CI

on:
  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v3
      
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0

      - name: test  
        run: ls -l
    
      - name: Install SBOM tool
        run: curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin & syft ./expensetracker
      