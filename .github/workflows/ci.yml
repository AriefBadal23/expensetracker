name: CI

on:
  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v3
      
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0

      - name: test  
        run: ls -l
    
      - name: Install SBOM tool
        env:
          CDXGEN_SECURE_MODE: "true"
        run: |
              VERSION="v13.8.0"
              ASSET="cdxgen-linux-amd64"
              BASE_URL="https://github.com/cdxgen/cdxgen/releases/download/${VERSION}"
              curl -fsSLO "${BASE_URL}/${ASSET}"
              curl -fsSLO "${BASE_URL}/${ASSET}.sha256"
              sha256sum -c "${ASSET}.sha256"
              chmod +x "${ASSET}"
              sudo mv "${ASSET}" /usr/local/bin/cdxgen

      - name: Create SBOM
        run: cdxgen -t js-o sbom.cdx.json .
      - uses: actions/upload-artifact@v7
        with:
          name: expensetracker-sbom
          path: sbom.cdx.json
      - name: Install Grype
        run: curl -sSfL https://get.anchore.io/grype | sudo sh -s -- -b /usr/local/bin
      - name: SCA Test
        run: grype sbom:sbom.cdx.json -o sarif --file report.sarif
      - uses: actions/upload-artifact@v7
        with:
          name: sca-report
          path: report.sarif
